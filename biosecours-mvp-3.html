/* IA locale et Claude */
const AMAP={'penicilline':['amoxicilline','ampicilline','augmentin','penicilline','oxacilline','cloxacilline','extencilline','benzathine'],'aspirine':['aspirine','acide acetylsalicylique','kardegic','aspegic'],'anti-inflammatoires':['ibuprofene','diclofenac','ketoprofene','naproxene','aspirine','piroxicam','voltarene','profenid'],'sulfamides':['cotrimoxazole','bactrim','sulfamethoxazole','fansidar'],'iode':['produit de contraste','betadine','povidone','iode'],'latex':['latex']};
const MNOTE={'asthme':['attention','Asthme : éviter bêtabloquants et anti-inflammatoires'],'diabete':['attention','Diabète : contrôler la glycémie dès l\'arrivée'],'drepanocytose':['critique','Drépanocytose : risque de crise, hydrater, oxygéner, traiter la douleur tôt'],'hypertension':['attention','Hypertension : surveiller la tension'],'epilepsie':['attention','Épilepsie : risque de crise convulsive'],'cardiaque':['critique','Maladie cardiaque : ECG rapide, prudence sur les perfusions'],'renale':['critique','Insuffisance rénale : adapter les doses'],'grossesse':['critique','Grossesse : limiter les radios, avis obstétrical']};
function localSummary(){const p=S.patient,a=age(p.naissance),al=[],av=[];
  p.allergies.forEach(x=>{al.push({niveau:'critique',texte:`Allergie à ${x}`});const k=Object.keys(AMAP).find(k=>norm(x).includes(k.slice(0,8)));if(k)av.push(...AMAP[k].slice(0,3));});
  p.maladies.forEach(x=>{const k=Object.keys(MNOTE).find(k=>norm(x).includes(k));if(k)al.push({niveau:MNOTE[k][0],texte:MNOTE[k][1]});});
  if(p.traitements.some(t=>norm(t).includes('anticoag')))al.push({niveau:'critique',texte:'Sous anticoagulant : risque de saignement'});
  const g=p.groupe&&p.groupe!=='Je ne sais pas'?`, groupe ${p.groupe}`:'';
  return{resume:`${p.prenom} ${p.nom}${a!=null?`, ${a} ans`:''}${g}. ${p.allergies.length?`${p.allergies.length} allergie${p.allergies.length>1?'s':''} connue${p.allergies.length>1?'s':''}.`:'Aucune allergie connue.'}${p.maladies.length?` Suivi pour ${p.maladies.join(', ').toLowerCase()}.`:''}`,alertes:al.slice(0,4),a_eviter:[...new Set(av)].slice(0,5),src:'local'};}
async function runSummary(){R.summary=localSummary();R.sumLoading=!!AI;render();if(!AI)return;const p=S.patient;
  try{const r=await askAI(`Tu assistes un médecin urgentiste au Togo face à un patient inconscient. À partir UNIQUEMENT de ces données (n'invente rien) : ${JSON.stringify({age:age(p.naissance),sexe:p.sexe,groupe:p.groupe,allergies:p.allergies,maladies:p.maladies,traitements:p.traitements,notes:p.notes})}
Réponds uniquement en JSON : {"resume":"2 phrases courtes et claires","alertes":[{"niveau":"critique" ou "attention","texte":"moins de 80 caractères"}],"a_eviter":["5 médicaments ou familles max"]}. 4 alertes maximum. Français simple, pas de tiret cadratin.`);
    if(r&&r.resume)R.summary={resume:String(r.resume),alertes:(Array.isArray(r.alertes)?r.alertes:[]).filter(x=>x&&x.texte).slice(0,4).map(x=>({niveau:x.niveau==='critique'?'critique':'attention',texte:String(x.texte)})),a_eviter:(Array.isArray(r.a_eviter)?r.a_eviter:[]).map(String).slice(0,5),src:'Claude'};}catch(e){if(e&&e.code==='not_granted')AI=null;}
  R.sumLoading=false;if(R.fileOpen)render();}
function localDrug(n0){const n=norm(n0),p=S.patient;
  for(const al of p.allergies){const k=Object.keys(AMAP).find(k=>norm(al).includes(k.slice(0,8)));if(k&&AMAP[k].some(m=>n.includes(m)||m.includes(n)))return{verdict:'contre-indique',explication:`Le patient est allergique à ${al}. ${n0.charAt(0).toUpperCase()+n0.slice(1)} fait partie de la même famille.`};if(n&&norm(al).includes(n))return{verdict:'contre-indique',explication:`Allergie déclarée à ${al}.`};}
  if(/cef|ceph|ceftri/.test(n)&&p.allergies.some(a=>norm(a).includes('penicil')))return{verdict:'prudence',explication:'Allergie à la pénicilline : un risque d\'allergie croisée existe avec ce produit.'};
  if(p.maladies.some(m=>norm(m).includes('asthme'))&&(AMAP['anti-inflammatoires'].some(m=>n.includes(m))||/olol/.test(n)))return{verdict:'prudence',explication:'Patient asthmatique : ce produit peut provoquer une crise d\'asthme.'};
  if(p.traitements.some(t=>norm(t).includes('anticoag'))&&AMAP['anti-inflammatoires'].some(m=>n.includes(m)))return{verdict:'prudence',explication:'Sous anticoagulant : risque de saignement plus élevé.'};
  return{verdict:'pas_de_signal',explication:'Rien dans le dossier ne s\'y oppose. Le dossier déclaré peut être incomplet.'};}
async function runDrug(){const name=($('#drug')?.value||'').trim();if(!name){toast('Écrivez le nom du médicament.');return;}
  R.drug={name,...localDrug(name)};if(AI){R.drugLoading=true;render();const p=S.patient;
    try{const r=await askAI(`Un urgentiste veut administrer « ${name} ». Allergies : ${JSON.stringify(p.allergies)}. Traitements : ${JSON.stringify(p.traitements)}. Maladies : ${JSON.stringify(p.maladies)}. Vérifie allergies croisées, interactions et contre-indications. Si ce n'est pas un médicament, dis-le.
Réponds uniquement en JSON : {"verdict":"contre-indique"|"prudence"|"pas_de_signal","explication":"1 ou 2 phrases simples en français, sans tiret cadratin"}`);
      if(r&&r.verdict)R.drug={name,verdict:['contre-indique','prudence','pas_de_signal'].includes(r.verdict)?r.verdict:R.drug.verdict,explication:String(r.explication||R.drug.explication)};}catch(e){if(e&&e.code==='not_granted')AI=null;}
    R.drugLoading=false;}
  render();log(`Dr ${S.doctor.prenom} ${S.doctor.nom}`,'Vérification d\'un médicament',`${name}`,R.drug.verdict==='contre-indique'?'crit':'info');}
function localMsgs(){const p=S.patient,h=hosp(S.doctor.hopitalId),maps=`https://maps.google.com/?q=${h.lat},${h.lng}`;
  return{sms:`Biosecours : ${p.prenom} ${p.nom} a été admis(e) aux urgences de ${h.nom} (${h.lieu}). Merci de vous y rendre avec une pièce d'identité. Itinéraire : ${maps}`,
  voix:`Bonjour, ici Biosecours, pour l'équipe des urgences de ${h.nom}. ${p.prenom} ${p.nom} vient d'être pris en charge aux urgences. Merci de vous rendre à l'accueil des urgences de ${h.nom} dès que possible. L'adresse vous a été envoyée par SMS. Appuyez sur 1 pour confirmer.`};}
async function genMsgs(){const A=R.alert,l=localMsgs();Object.assign(A,l,{src:'local'});if(!AI){render();return;}A.loading=true;render();
  const p=S.patient,h=hosp(S.doctor.hopitalId),maps=`https://maps.google.com/?q=${h.lat},${h.lng}`;
  try{const r=await askAI(`Rédige deux messages en français pour prévenir la famille d'un patient admis aux urgences au Togo. Patient : ${p.prenom} ${p.nom}. Hôpital : ${h.nom}, ${h.lieu}. Lien d'itinéraire : ${maps}. Expéditeur : Biosecours, pour l'équipe des urgences.
Règles : aucune information médicale, ton calme et rassurant, vouvoiement, phrases simples, pas de tiret cadratin.
"sms" : 280 caractères maximum, contient le lien tel quel. "voix" : 55 mots maximum pour une voix de synthèse, se termine par « Appuyez sur 1 pour confirmer. »
Réponds uniquement en JSON : {"sms":"...","voix":"..."}`);
    if(r&&r.sms&&r.voix){A.sms=String(r.sms);A.voix=String(r.voix);A.src='Claude';}}catch(e){if(e&&e.code==='not_granted')AI=null;}
  A.loading=false;if(R.alert)render();}
function dataURLtoBlob(u){const[h,b]=u.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime});}
async function aiCarte(){const d=S.doctor;R.adminAI=true;render();let res=null;
  if(AI&&d.carte){try{const lim=AI.limits?await AI.limits():null;if(lim&&lim.images){const r=await askAI(`L'image est une carte professionnelle de soignant. Lis le nom et le numéro. Compare avec : nom « ${d.nom} », prénom « ${d.prenom} », numéro « ${d.ordre} ». Réponds uniquement en JSON : {"nom_lu":"","numero_lu":"","correspond":true|false,"remarque":"1 phrase simple sans tiret cadratin"}`,{images:[dataURLtoBlob(d.carte)]});if(r)res={ok:!!r.correspond,text:`Nom lu : ${r.nom_lu||'illisible'}. Numéro lu : ${r.numero_lu||'illisible'}. ${r.remarque||''}`,src:'Lecture par Claude'};}}catch(e){if(e&&e.code==='not_granted')AI=null;}}
  if(!res){await sleep(900);res={ok:ordreOK(d.ordre),text:ordreOK(d.ordre)?'Carte lisible, numéro au bon format. Correspondance à confirmer par l\'agent.':'Numéro au format inhabituel, contrôle manuel conseillé.',src:'Contrôle automatique'};}
  d.aiCheck=res;R.adminAI=false;save();render();}

/* Alerte */
function speak(t,end){try{if(!('speechSynthesis' in window)){setTimeout(()=>end&&end(),3000);return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;let fired=false;const f=()=>{if(!fired){fired=true;end&&end();}};u.onend=f;u.onerror=f;setTimeout(f,Math.max(6000,t.length*75));speechSynthesis.speak(u);}catch(e){setTimeout(()=>end&&end(),3000);}}
function stopSpeak(){try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
let aid=0;
async function launch(){const A=R.alert,my=++aid;A.phase='run';A.smsDone=0;A.calls=[];render();
  const doc=`Dr ${S.doctor.prenom} ${S.doctor.nom}`,h=hosp(S.doctor.hopitalId);
  log(doc,'Alerte envoyée à votre famille',`Depuis ${h.nom}`,'warn');
  for(let i=0;i<S.patient.contacts.length;i++){await sleep(500);if(my!==aid||!R.alert)return;A.smsDone=i+1;render();}
  call(0,my);}
function call(i,my){const A=R.alert;if(!A||my!==aid)return;const c={i,state:'ring'};A.calls.push(c);A.cur=c;render();
  setTimeout(()=>{if(my!==aid||c.state!=='ring')return;c.state='talk';render();speak(A.voix,()=>{if(my!==aid||c.state!=='talk')return;c.state='wait';c.cd=3;render();const iv=setInterval(()=>{if(my!==aid||c.state!=='wait'){clearInterval(iv);return;}c.cd--;if(c.cd<=0){clearInterval(iv);c.state='ok';A.phase='done';A.success=true;A.who=c.i;A.tEnd=Date.now();render();log('IA Biosecours','Votre proche a été prévenu',S.patient.contacts[c.i].nom,'ok');}else render();},1000);});},2400);}
function noAnswer(){const A=R.alert;if(!A||!A.cur)return;const c=A.cur,my=aid;stopSpeak();c.state='no';render();
  if(c.i+1<S.patient.contacts.length)setTimeout(()=>call(c.i+1,my),700);
  else{A.phase='done';A.success=false;A.tEnd=Date.now();render();log('IA Biosecours','Aucun proche joint','Relance automatique programmée','crit');}}

/* Caméra */
let stream=null,raf=null;
async function openCam(){R.scanner={msg:'Autorisation de la caméra…'};render();const m=t=>{R.scanner&&(R.scanner.msg=t);const e=$('#cmsg');if(e)e.textContent=t;};
  try{if(!navigator.mediaDevices?.getUserMedia)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#cam');if(!v){stopCam();return;}v.srcObject=stream;await v.play();m('Placez le QR code dans le cadre.');
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const tick=()=>{if(!R.scanner)return;if(v.readyState===v.HAVE_ENOUGH_DATA&&typeof window.jsQR==='function'){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);const c=window.jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:'dontInvert'});if(c&&c.data){onScan(c.data);return;}}raf=requestAnimationFrame(tick);};tick();
  }catch(e){m('La caméra n\'est pas disponible ici. Utilisez le patient de démo.');}}
function stopCam(){if(raf)cancelAnimationFrame(raf);raf=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function onScan(data){stopCam();R.scanner=null;const m=String(data).toUpperCase().match(/[0-9A-F]{16}/);if(m&&m[0]===S.patient.uid&&S.patient.nom)openFile('scan du QR code');else{render();toast('Code non reconnu.');}}
function openFile(via){if(!S.patient.nom){toast('Aucune carte patient sur cet appareil.');return;}R.fileOpen=true;R.drug=null;const h=hosp(S.doctor.hopitalId);
  log(`Dr ${S.doctor.prenom} ${S.doctor.nom}`,'Votre dossier a été ouvert',`${h.nom}, par ${via}, présence à l'hôpital vérifiée`,'warn');window.scrollTo(0,0);runSummary();}

/* Téléchargements */
function drawQR(x,X,Y,size){const r=qrData(qrText());if(!r)return;const n=r.n,cell=size/(n+4);x.fillStyle='#fff';x.fillRect(X,Y,size,size);x.fillStyle='#0C2644';for(let i=0;i<n;i++)for(let j=0;j<n;j++)if(r.q.isDark(i,j))x.fillRect(Math.floor(X+(j+2)*cell),Math.floor(Y+(i+2)*cell),Math.ceil(cell),Math.ceil(cell));}
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function wpCanvas(){const W=1170,H=2532,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const g=x.createRadialGradient(W/2,0,60,W/2,0,H*.85);
  if(S.wp==='rouge'){g.addColorStop(0,'#FF5C62');g.addColorStop(.5,'#C2181F');g.addColorStop(1,'#6E0B10');}else{g.addColorStop(0,'#3490FA');g.addColorStop(.45,'#0E62C1');g.addColorStop(1,'#0A3669');}
  x.fillStyle=g;x.fillRect(0,0,W,H);const cw=780,ch=1000,X=(W-cw)/2,Y=1240;x.fillStyle='#fff';rr(x,X,Y,cw,ch,60);x.fill();
  x.textAlign='center';x.fillStyle='#C2181F';x.font='800 48px "Archivo",sans-serif';x.fillText('Urgence médicale, scannez-moi',W/2,Y+105);
  drawQR(x,(W-620)/2,Y+145,620);x.fillStyle='#5B6E83';x.font='600 34px "Archivo",sans-serif';x.fillText('Réservé au personnel soignant',W/2,Y+835);
  x.font='800 38px Sora,sans-serif';x.fillStyle='#0C2644';x.fillText('Biosecours',W/2,Y+905);return c;}
function stCanvas(){const c=document.createElement('canvas');c.width=700;c.height=840;const x=c.getContext('2d');x.fillStyle='#fff';rr(x,0,0,700,840,60);x.fill();drawQR(x,40,40,620);x.textAlign='center';x.fillStyle='#C2181F';x.font='800 50px "Archivo",sans-serif';x.fillText('Urgence : scannez',350,735);x.fillStyle='#0C2644';x.font='800 34px Sora,sans-serif';x.fillText('Biosecours',350,790);return c;}
async function download(c,name){const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(DL){try{await DL.save({filename:name,data:blob});return;}catch(e){if(e&&e.code==='declined')return;}}
  const box=$('#dlf');if(box){box.innerHTML=`<div class="dl" style="flex-direction:column;align-items:flex-start"><strong>Enregistrez l'image</strong><span>Appui long sur l'image (téléphone) ou clic droit (ordinateur), puis « Enregistrer l'image ».</span><img src="${c.toDataURL('image/png')}" alt="${esc(name)}" style="max-width:200px;border-radius:14px;margin-top:10px"></div>`;box.scrollIntoView({behavior:'smooth',block:'center'});}}
function readImg(f,max,cb){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85));};im.onerror=()=>toast('Image illisible.');im.src=fr.result;};fr.readAsDataURL(f);}

/* Événements */
document.addEventListener('input',e=>{const el=e.target.closest('[data-bind]');if(!el)return;setP(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);if(R.err[el.dataset.bind]){delete R.err[el.dataset.bind];el.closest('.field')?.classList.remove('err');}save();});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('select[data-bind]')){const b=el.dataset.bind;if(b==='doctor.fonction'){if(el.value==='__autre'){R.fAutre=true;S.doctor.fonction='';save();render();setTimeout(()=>$('#f-autre')?.focus(),60);return;}R.fAutre=false;}setP(b,el.value);if(b==='doctor.hopitalId'){R.geo=null;R.geoAsked=false;R.check=null;}save();if(b==='doctor.fonction'||b==='doctor.hopitalId'){render();if(el.value==='autre')setTimeout(()=>$('#h-autre')?.focus(),60);}}
  if(el.matches('[data-bind][type=checkbox]')){delete R.err.attest;}
  if(el.matches('[data-file]')&&el.files&&el.files[0]){const k=el.dataset.file;readImg(el.files[0],k==='carte'?900:360,u=>{if(k==='photo')S.patient.photo=u;else if(k==='dphoto'){S.doctor.photo=u;delete R.err.dphoto;}else{S.doctor.carte=u;delete R.err.carte;}save();render();toast(k==='carte'?'Carte ajoutée.':'Photo ajoutée.');});el.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.matches('[data-add]')){e.preventDefault();addTag(e.target.dataset.add,e.target.value);}if(e.target.id==='drug'){e.preventDefault();runDrug();}if(e.target.id==='mid'){e.preventDefault();act('manual');}if(R.authM&&/^au-/.test(e.target.id)){e.preventDefault();authGo();}if(e.target.id==='pinu'){e.preventDefault();pinUnlock();}if(e.target.id==='pin2'){e.preventDefault();pinSave();}}
  if(e.key==='Escape'){if(R.scanner){stopCam();R.scanner=null;render();}else if(R.alert&&R.alert.phase!=='run'){closeAlert();}}});
document.addEventListener('click',e=>{const tl=e.target.closest('[data-tel]');if(tl){const n=tl.dataset.tel;setTimeout(()=>toast(`Appel du ${n} lancé. Si rien ne se passe, composez le ${n} manuellement.`),400);}const lg=e.target.closest('[data-log]');if(lg){log(`Dr ${S.doctor.prenom} ${S.doctor.nom}`,'Appel direct d\'un proche',S.patient.contacts[+lg.dataset.log]?.nom||'','info');return;}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return;}const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();act(t.dataset.a,t.dataset);});
function addTag(k,v){v=String(v||'').trim();if(!v)return;if(S.patient[k].some(x=>norm(x)===norm(v))){toast('Déjà ajouté.');return;}S.patient[k].push(v);save();render();}
function closeAlert(){aid++;stopSpeak();R.alert=null;render();}
function act(a,d={}){
  switch(a){
  case 'sampleP':samplePatient();save();render();toast('Exemple chargé. Remplacez-le par vos informations quand vous voulez.');break;
  case 'pstep':R.pstep=+d.n;render();window.scrollTo(0,0);break;
  case 'pnext':{const n=+d.n;if(n===2){const err={};if(!S.patient.prenom.trim())err['patient.prenom']='Indiquez votre prénom';if(!S.patient.nom.trim())err['patient.nom']='Indiquez votre nom';if(S.patient.tel.replace(/\D/g,'').length<8)err['patient.tel']='Numéro incomplet';R.err=err;if(Object.keys(err).length){render();toast('Quelques informations manquent.');return;}}
    if(n===4&&!S.patient.contacts.length){toast('Ajoutez au moins un proche.');return;}R.pstep=n;render();window.scrollTo(0,0);break;}
  case 'blood':S.patient.groupe=d.v;save();render();break;
  case 'toggle':{const arr=S.patient[d.k],i=arr.findIndex(x=>norm(x)===norm(d.v));if(i>=0)arr.splice(i,1);else arr.push(d.v);save();render();break;}
  case 'addTag':{const i=document.querySelector(`[data-add="${d.k}"]`);addTag(d.k,i?.value);break;}
  case 'addContact':{const nom=$('#c-nom').value.trim(),lien=$('#c-lien').value,tel=$('#c-tel').value.trim();if(!nom){toast('Indiquez le nom du proche.');$('#c-nom').focus();return;}if(tel.replace(/\D/g,'').length<8){toast('Le numéro semble incomplet.');$('#c-tel').focus();return;}S.patient.contacts.push({nom,lien,tel});save();render();toast(`${nom} ajouté(e) en position ${S.patient.contacts.length}.`);break;}
  case 'cmove':{const i=+d.i,k=+d.d,c=S.patient.contacts;[c[i],c[i+k]]=[c[i+k],c[i]];save();render();break;}
  case 'cdel':S.patient.contacts.splice(+d.i,1);save();render();break;
  case 'wp':S.wp=d.v;save();render();break;
  case 'dlWp':download(wpCanvas(),'biosecours-fond-ecran.png');break;
  case 'dlSt':download(stCanvas(),'biosecours-autocollant.png');break;
  case 'regen':if(confirm('Créer un nouveau code ? L\'ancien fond d\'écran et l\'autocollant ne fonctionneront plus.')){S.patient.uid=genUid();save();log('Vous','Nouveau code généré','L\'ancien code est désactivé','warn');render();toast('Nouveau code créé. Téléchargez le nouveau fond d\'écran.');}break;
  case 'verify':verifyChain().then(v=>{R.verify=v;render();});break;
  case 'burst':R.burst='run';render();setTimeout(()=>{R.burst={};render();log('Contrôle IA Biosecours','Tentative de scans en série bloquée','12 scans en 40 secondes','crit');},1400);break;
  case 'demoDoc':go('medecin');break;
  case 'rmPhoto':if(d.k==='dphoto')S.doctor.photo='';else S.patient.photo='';save();render();break;
  case 'docEdit':R.docEdit=true;R.err={};render();window.scrollTo(0,0);break;
  case 'docEditCancel':R.docEdit=false;R.err={};render();window.scrollTo(0,0);break;
  case 'sampleD':sampleDoctor();R.err={};save();render();break;
  case 'submitD':{const dd=S.doctor,err={};if(!dd.prenom.trim())err['doctor.prenom']='Obligatoire';if(!dd.nom.trim())err['doctor.nom']='Obligatoire';if(!dd.ordre.trim())err['doctor.ordre']='Obligatoire';if(!String(dd.fonction||'').trim())err['doctor.fonction']=fAutre()?'Précisez votre fonction':'Obligatoire';if(dd.hopitalId==='autre'&&!String(dd.hopAutreNom||'').trim())err['doctor.hopAutreNom']='Indiquez le nom de l\'établissement';if(!dd.carte)err.carte='Ajoutez la photo de votre carte.';if(!dd.photo)err.dphoto='Ajoutez votre photo.';if(!dd.attest)err.attest='Cochez cette case.';R.err=err;if(Object.keys(err).length){render();toast('Complétez les champs en rouge.');return;}
    if(R.docEdit){R.docEdit=false;save();render();window.scrollTo(0,0);toast('Profil enregistré.');break;}dd.status='pending';dd.aiCheck=null;save();render();window.scrollTo(0,0);break;}
  case 'aiCarte':aiCarte();break;
  case 'validate':S.doctor.status='validated';save();R.check=null;render();window.scrollTo(0,0);toast('Médecin validé. Il peut maintenant se connecter.');break;
  case 'refuse':S.doctor.status='refused';save();render();break;
  case 'docReset':if(confirm('Supprimer ce médecin de l\'appareil ?')){const k=S.doctor.hopitalId;S.doctor=defaults().doctor;S.doctor.hopitalId=k;R.auth=false;R.check=null;R.fileOpen=false;save();render();}break;
  case 'runCheck':runCheck();break;
  case 'fraud':runCheck(d.k);break;
  case 'enter':R.auth=true;R.sessionStart=Date.now();R.fileOpen=false;render();window.scrollTo(0,0);break;
  case 'logout':R.auth=false;R.fileOpen=false;R.check=null;R.summary=null;render();break;
  case 'cam':openCam();break;
  case 'closeCam':stopCam();R.scanner=null;render();break;
  case 'scanDemo':stopCam();R.scanner=null;openFile('scan du QR code');break;
  case 'manual':{const v=($('#mid')?.value||'').replace(/\s/g,'').toUpperCase();if(v===S.patient.uid&&S.patient.nom)openFile('saisie du numéro');else toast('Numéro de carte inconnu.');break;}
  case 'closeFile':R.fileOpen=false;R.summary=null;R.drug=null;render();break;
  case 'drug':runDrug();break;
  case 'alert':R.alert={phase:'prep',sms:'',voix:'',src:'local',loading:false};genMsgs();break;
  case 'listen':speak(R.alert.voix);break;
  case 'launch':launch();break;
  case 'noAnswer':noAnswer();break;
  case 'closeAlert':closeAlert();break;
  case 'authOpen':authOpen(d.t,d.r);break;
  case 'authTab':authGrab();R.authM.tab=d.t;R.authM.err='';render();break;
  case 'authRole':authGrab();R.authM.role=d.r;render();break;
  case 'authForgot':authForgot();break;
  case 'pinSave':pinSave();break;
  case 'pinEdit':R.pinEdit=true;R.pinErr='';render();break;
  case 'pinUnlock':pinUnlock();break;
  case 'pinForgot':accSignOut().then(()=>authOpen('login','patient'));break;
  case 'authGo':authGo();break;
  case 'simCard':simCard();break;
  case 'askGeo':askGeo();break;
  case 'simGeo':S.doctor.simGeo=!S.doctor.simGeo;R.check=null;R.geoAsked=true;save();render();toast(S.doctor.simGeo?'Environnement de test activé.':'Vérification réelle de la position activée.');break;
  case 'accOut':accSignOut().then(()=>{render();window.scrollTo(0,0);toast('Vous êtes déconnecté. À bientôt.');});break;
  case 'reset':if(confirm('Effacer toutes les données de démonstration ?')){try{localStorage.removeItem(LS_KEY);localStorage.removeItem(SES_LS);}catch(e){}A.user=null;S=defaults();Object.assign(R,{docEdit:false,view:'accueil',pstep:1,err:{},check:null,auth:false,fileOpen:false,summary:null,drug:null,alert:null,burst:null,verify:null});render();window.scrollTo(0,0);toast('Données effacées.');}break;
  }
}
setInterval(()=>{const t=$('#tm');if(t)t.textContent=timer();if(R.auth&&R.sessionStart&&Date.now()-R.sessionStart>SESSION_MIN*60000){R.auth=false;R.fileOpen=false;R.check=null;toast('Session expirée, reconnectez-vous.');render();}},1000);
try{window.speechSynthesis&&speechSynthesis.getVoices();}catch(e){}
render();
accBoot().then(()=>render());
window.__bs={get R(){return R},get S(){return S},A};
})();
</script>
