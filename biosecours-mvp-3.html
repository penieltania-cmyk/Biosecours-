<style>
:root{
  --bg:#F3F8FE; --surface:#FFFFFF; --sky:#E6F1FD; --sky-2:#F0F7FF;
  --ink:#0B1F3A; --muted:#5B6B82; --line:#DCE7F5;
  --blue:#1565D8; --blue-2:#0E4FB0; --blue-soft:#E3EFFD; --cyan:#0EA5C6;
  --red:#E5484D; --red-2:#C93439; --red-soft:#FDECEC; --orange:#F07A3A;
  --green:#12A37F; --green-soft:#E1F6EF; --amber:#A36A00; --amber-soft:#FFF3D6;
  --navy:#0B1F3A;
  --f-d:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
  --f-b:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --shadow:0 10px 30px -18px rgba(21,101,216,.35); color-scheme:light;
}
@media (max-width:0px){:root:not([data-theme="light"]){
  --bg:#0A1628; --surface:#112340; --sky:#14305A; --sky-2:#0E1F3A;
  --ink:#EAF2FC; --muted:#9FB3CC; --line:#22406A;
  --blue:#5EA2F5; --blue-2:#8CBEF8; --blue-soft:#163A68; --cyan:#3CC8E2;
  --red:#FF6B6E; --red-2:#FF8A8C; --red-soft:#3A1A1E; --orange:#FF9A5E;
  --green:#3FD0A3; --green-soft:#10342B; --amber:#F2B84B; --amber-soft:#33290E;
  --navy:#0B1F3A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1628; --surface:#112340; --sky:#14305A; --sky-2:#0E1F3A;
  --ink:#EAF2FC; --muted:#9FB3CC; --line:#22406A;
  --blue:#5EA2F5; --blue-2:#8CBEF8; --blue-soft:#163A68; --cyan:#3CC8E2;
  --red:#FF6B6E; --red-2:#FF8A8C; --red-soft:#3A1A1E; --orange:#FF9A5E;
  --green:#3FD0A3; --green-soft:#10342B; --amber:#F2B84B; --amber-soft:#33290E;
  --navy:#0B1F3A; color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;}
*,*::before,*::after{box-sizing:inherit;}
html,body{margin:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px;}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;letter-spacing:-0.02em;line-height:1.15;}
p{margin:0;}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
@media (max-width:560px){.wrap{padding:0 18px;}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);}
.nav-in{display:flex;align-items:center;gap:28px;height:72px;}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;background:none;border:0;padding:0;}
.brand svg{width:38px;height:38px;flex:none;}
.bw{font-family:var(--f-d);font-weight:800;font-size:22px;letter-spacing:-0.03em;color:var(--ink);}
.bw b{color:var(--red);font-weight:800;}
.links{display:flex;gap:4px;margin-left:auto;}
.links button{background:none;border:0;padding:10px 14px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted);}
.links button:hover{color:var(--ink);background:var(--sky-2);}
.links button[aria-current="page"]{color:var(--blue);background:var(--sky);}
.nav .btn{flex:none;}
@media (max-width:980px){
  .nav-in{flex-wrap:wrap;height:auto;padding-top:12px;padding-bottom:0;gap:12px;}
  .nav .nav-cta{margin-left:auto;}
  .links{order:3;width:100%;margin:0 -8px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;}
  .links::-webkit-scrollbar{display:none;}
  .links button{white-space:nowrap;font-size:14px;padding:8px 12px;}
}
@media (max-width:560px){.nav-cta{display:none;}}
.contact .c-rank,.fam .c-rank{color:#fff;font-size:16px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;border:2px solid transparent;padding:12px 20px;font-weight:800;font-size:15px;line-height:1.2;text-decoration:none;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s;white-space:nowrap;}
.btn:active{transform:translateY(1px);}
.btn svg{width:19px;height:19px;flex:none;}
.btn-lg{padding:16px 26px;font-size:16.5px;border-radius:14px;}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:10px;}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 10px 22px -12px var(--blue);}
.btn-blue:hover{background:var(--blue-2);}
.btn-red{background:var(--red);color:#fff;box-shadow:0 10px 22px -12px var(--red);}
.btn-red:hover{background:var(--red-2);}
.btn-green{background:var(--green);color:#fff;}
.btn-line{background:var(--surface);border-color:var(--line);color:var(--ink);}
.btn-line:hover{border-color:var(--blue);color:var(--blue);}
.btn-white{background:#fff;color:#0C2644;}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;}
.btn-block{width:100%;}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px;}

/* Hero */
.hero{background:transparent;overflow:hidden;}
.hero-in{display:grid;grid-template-columns:1.02fr .98fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px;}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:14px;padding:7px 14px 7px 8px;border-radius:999px;}
.badge i{width:22px;height:22px;border-radius:50%;background:var(--red-soft);display:grid;place-items:center;}
.badge i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 var(--red);animation:pulse 2s ease-out 3;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(227,52,59,.55)}100%{box-shadow:0 0 0 12px rgba(227,52,59,0)}}
.hero h1{font-size:clamp(38px,5vw,62px);font-weight:800;letter-spacing:-0.04em;line-height:1.04;margin-top:22px;max-width:15ch;}
.hero .lead{font-size:clamp(17px,1.5vw,19.5px);color:var(--muted);margin-top:20px;max-width:50ch;}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:34px;}
.trust span{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink);}
.trust svg{width:20px;height:20px;color:var(--green);flex:none;}
.hero-art{position:relative;}
.hero-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 30px 40px rgba(14,38,66,.14));}
@media (max-width:920px){.hero-in{grid-template-columns:1fr;padding-top:40px;gap:24px;}.hero-art{max-width:560px;margin:0 auto;width:100%;}}

/* Sections */
.sec{padding:88px 0;}
@media (max-width:640px){.sec{padding:60px 0;}}
.sec-h{max-width:720px;}
.sec-h.center{margin:0 auto;text-align:center;}
.kick{color:var(--blue);font-weight:800;font-size:15px;margin-bottom:10px;}
.sec-h h2{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-0.035em;}
.sec-h p{color:var(--muted);font-size:17.5px;margin-top:14px;}
.problem{background:var(--navy);color:#fff;position:relative;overflow:hidden;}
.problem .kick{color:#FF8A8F;}
.problem .sec-h p{color:#BBC9DA;}
.prob-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px;}
.prob{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:28px;}
.prob-ic{width:56px;height:56px;border-radius:16px;background:rgba(227,52,59,.16);color:#FF8A8F;display:grid;place-items:center;}
.prob-ic svg{width:28px;height:28px;}
.prob h3{font-size:20px;margin-top:18px;}
.prob p{color:#BBC9DA;margin-top:8px;font-size:15.5px;}
.prob-out{margin-top:28px;display:flex;align-items:center;gap:14px;background:var(--red);border-radius:18px;padding:18px 22px;font-weight:700;font-size:16.5px;}
.prob-out svg{width:26px;height:26px;flex:none;}
@media (max-width:860px){.prob-grid{grid-template-columns:1fr;}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:52px;counter-reset:s;}
.step{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:28px;position:relative;box-shadow:var(--shadow);}
.step-art{height:150px;border-radius:18px;background:var(--sky);display:grid;place-items:center;margin-bottom:22px;overflow:hidden;}
.step-art svg{height:130px;width:auto;}
.step-n{position:absolute;top:18px;left:18px;width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;font-family:var(--f-d);font-weight:800;display:grid;place-items:center;font-size:17px;box-shadow:0 8px 16px -8px var(--blue);}
.step h3{font-size:21px;}
.step p{color:var(--muted);margin-top:8px;font-size:15.5px;}
@media (max-width:900px){.steps{grid-template-columns:1fr;}}

.spaces{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px;}
.space{border-radius:26px;padding:30px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--surface);}
.space-ic{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;}
.space-ic svg{width:30px;height:30px;}
.space h3{font-size:23px;}
.space p{color:var(--muted);font-size:15.5px;}
.space ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px;font-weight:600;}
.space li{display:flex;gap:9px;align-items:flex-start;}
.space li svg{width:18px;height:18px;flex:none;margin-top:3px;}
.space .btn{margin-top:auto;align-self:flex-start;}
.sp-blue .space-ic{background:var(--blue-soft);color:var(--blue);} .sp-blue li svg{color:var(--blue);}
.sp-grey .space-ic{background:var(--sky);color:var(--muted);} .sp-grey li svg{color:var(--muted);}
.sp-red{background:#0C2644;border-color:transparent;color:#fff;}
.sp-red p{color:#BBC9DA;} .sp-red .space-ic{background:rgba(227,52,59,.2);color:#FF8A8F;} .sp-red li svg{color:#FF8A8F;}
@media (max-width:980px){.spaces{grid-template-columns:1fr;}}

.ai{background:#0F71E1;color:#fff;border-radius:34px;padding:64px;display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center;position:relative;overflow:hidden;}
.ai .kick{color:#C3DDFB;}
.ai h2{font-size:clamp(30px,3.4vw,42px);font-weight:800;letter-spacing:-0.035em;}
.ai .sec-h p{color:#D7E9FD;}
.ai-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.ai-it{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:20px;}
.ai-it .ico{width:44px;height:44px;border-radius:12px;background:#fff;color:var(--blue);display:grid;place-items:center;}
.ai-it .ico svg{width:22px;height:22px;}
.ai-it h3{font-size:17px;margin-top:14px;}
.ai-it p{font-size:14.5px;color:#D7E9FD;margin-top:6px;}
@media (max-width:980px){.ai{grid-template-columns:1fr;padding:40px 28px;border-radius:26px;}}
@media (max-width:560px){.ai-list{grid-template-columns:1fr;}}

.sec-cmp{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px;}
.cmp{border-radius:26px;padding:30px;border:1px solid var(--line);background:var(--surface);}
.cmp h3{font-size:21px;display:flex;align-items:center;gap:12px;}
.cmp h3 span{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;}
.cmp h3 svg{width:22px;height:22px;}
.cmp ul{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px;}
.cmp li{display:flex;gap:10px;align-items:center;font-weight:600;}
.cmp li svg{width:20px;height:20px;flex:none;}
.cmp.no h3 span{background:var(--sky);color:var(--muted);} .cmp.no li svg{color:var(--red);}
.cmp.yes{border:2px solid var(--blue);} .cmp.yes h3 span{background:var(--blue-soft);color:var(--blue);} .cmp.yes li svg{color:var(--green);}
@media (max-width:820px){.sec-cmp{grid-template-columns:1fr;}}

.final{background:var(--red);color:#fff;border-radius:34px;padding:56px;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;}
.final h2{font-size:clamp(28px,3.2vw,40px);font-weight:800;max-width:20ch;letter-spacing:-0.03em;}
.final p{color:#FFE1E2;margin-top:10px;max-width:48ch;}
@media (max-width:560px){.final{padding:34px 26px;border-radius:26px;}}

footer.foot{border-top:1px solid var(--line);padding:30px 0 40px;margin-top:40px;color:var(--muted);font-size:14px;}
.foot-in{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.foot-in span{flex:1 1 300px;}

/* Page header */
.phead{background:transparent;padding:44px 0 30px;}
.phead-in{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.phead h1{font-size:clamp(30px,4vw,44px);font-weight:800;letter-spacing:-0.035em;}
.phead p{color:var(--muted);margin-top:8px;font-size:17px;max-width:58ch;}

/* Stepper */
.stepper{display:flex;gap:8px;margin-top:28px;flex-wrap:wrap;}
.stepper button{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 16px 7px 7px;font-weight:700;font-size:14.5px;color:var(--muted);}
.stepper .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--muted);font-family:var(--f-d);font-weight:800;font-size:14px;}
.stepper .n svg{width:15px;height:15px;}
.stepper button.done .n{background:var(--green);color:#fff;}
.stepper button.cur{border-color:var(--blue);color:var(--ink);box-shadow:0 0 0 3px var(--blue-soft);}
.stepper button.cur .n{background:var(--blue);color:#fff;}
.stepper button[disabled]{cursor:default;opacity:.8;}
@media (max-width:640px){.stepper button:not(.cur) .t{display:none;}.stepper button:not(.cur){padding:7px;}}

/* Layout pages */
.pgrid{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start;padding-top:30px;padding-bottom:60px;}
.pgrid>*{min-width:0;}
.aside{position:sticky;top:96px;display:grid;gap:18px;}
@media (max-width:1000px){.pgrid{grid-template-columns:1fr;}.aside{position:static;}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow);}
@media (max-width:560px){.card{padding:22px;border-radius:20px;}}
.card h2{font-size:25px;font-weight:800;}
.card .sub{color:var(--muted);margin-top:6px;margin-bottom:26px;max-width:60ch;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media (max-width:620px){.grid2{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:7px;}
.field .l{font-weight:700;font-size:14.5px;}
.field .h{font-size:13px;color:var(--muted);}
.field.err .h{color:var(--red);font-weight:700;}
.in,.field input,.field select,.field textarea{width:100%;background:var(--sky-2);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;transition:border-color .15s,background .15s,box-shadow .15s;}
.in:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 4px var(--blue-soft);}
.field.err input,.field.err select{border-color:var(--red);}
.field textarea{min-height:92px;resize:vertical;}
.q{margin-top:30px;}
.q:first-of-type{margin-top:0;}
.q-t{font-family:var(--f-d);font-weight:700;font-size:17px;}
.q-h{color:var(--muted);font-size:14.5px;margin-top:2px;margin-bottom:12px;}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap;}
.actions .right{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}

.photo{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding:18px;border-radius:18px;background:var(--sky-2);border:1.5px dashed var(--line);}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;font-size:32px;overflow:hidden;flex:none;border:4px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);}
.avatar img{width:100%;height:100%;object-fit:cover;}
.photo strong{display:block;font-size:16px;}
.photo p{font-size:14px;color:var(--muted);margin:3px 0 10px;}

.blood{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;}
@media (max-width:700px){.blood{grid-template-columns:repeat(5,1fr);}}
.blood button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 0;font-family:var(--f-d);font-weight:800;font-size:17px;}
.blood button:last-child{font-size:12.5px;font-family:var(--f-b);}
.blood button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 8px 18px -10px var(--red);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;}
.chip:hover{border-color:var(--blue);}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;}
.chip.al[aria-pressed="true"]{background:var(--red);border-color:var(--red);}
.chip svg{width:14px;height:14px;}
.addline{display:flex;gap:8px;margin-top:10px;max-width:460px;}
.addline input{flex:1;min-width:0;}

.contact{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--sky-2);border:1px solid var(--line);}
.contact+.contact{margin-top:10px;}
.c-rank{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;font-family:var(--f-d);font-weight:800;display:grid;place-items:center;flex:none;}
.contact .who{flex:1;min-width:0;}
.contact strong{display:block;}
.contact span{font-size:14px;color:var(--muted);}
.ib{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);flex:none;}
.ib:hover{color:var(--ink);border-color:var(--ink);}
.ib svg{width:17px;height:17px;}
.ib[disabled]{opacity:.35;cursor:default;}
.addbox{margin-top:18px;padding:20px;border-radius:18px;border:1.5px dashed var(--blue);background:var(--sky-2);}
.addbox .grid3{display:grid;grid-template-columns:1.3fr 1fr 1.2fr;gap:12px;}
@media (max-width:700px){.addbox .grid3{grid-template-columns:1fr;}}
.empty{padding:22px;border-radius:16px;background:var(--amber-soft);color:var(--ink);font-size:15px;display:flex;gap:10px;align-items:flex-start;}
.empty svg{width:20px;height:20px;color:var(--amber);flex:none;margin-top:2px;}

/* Carte d'urgence (aperçu) */
.ecard{border-radius:24px;padding:22px;color:#fff;background:#0F71E1;position:relative;overflow:hidden;box-shadow:0 30px 50px -28px rgba(16,80,153,.8);}
.ecard::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);}
.ecard::after{content:"";position:absolute;left:-40px;bottom:-80px;width:200px;height:200px;border-radius:50%;background:rgba(227,52,59,.25);}
.ec-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.ec-brand{display:flex;align-items:center;gap:8px;font-family:var(--f-d);font-weight:800;font-size:17px;}
.ec-brand svg{width:28px;height:28px;}
.ec-tag{background:var(--red);font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;}
.ec-body{display:flex;gap:18px;align-items:center;margin-top:20px;position:relative;z-index:1;}
.ec-qr{width:128px;height:128px;background:#fff;border-radius:16px;padding:8px;flex:none;}
.ec-qr svg{width:100%;height:100%;display:block;}
.ec-body strong{font-family:var(--f-d);font-size:19px;line-height:1.2;display:block;}
.ec-body p{font-size:13px;color:#D7E9FD;margin-top:6px;}
.ec-foot{margin-top:18px;display:flex;justify-content:space-between;font-size:12px;color:#C3DDFB;position:relative;z-index:1;font-variant-numeric:tabular-nums;}
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;}
.side-card h3{font-size:17px;}
.side-card p{font-size:14px;color:var(--muted);margin-top:4px;}
.progress{margin-top:12px;height:10px;border-radius:99px;background:var(--sky);overflow:hidden;}
.progress i{display:block;height:100%;border-radius:99px;background:#4394F1;transition:width .3s;}
.prow{display:flex;justify-content:space-between;font-weight:700;font-size:14.5px;}
.prow span:last-child{color:var(--blue);}

.qr-final{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
@media (max-width:760px){.qr-final{grid-template-columns:1fr;}}
.wp{border-radius:22px;aspect-ratio:9/16;max-height:440px;padding:26px 18px 18px;display:flex;flex-direction:column;align-items:center;color:#fff;position:relative;overflow:hidden;margin:0 auto;width:100%;max-width:250px;}
.wp.bleu{background:#3490FA;}
.wp.rouge{background:#FF5C62;}
.wp-time{font-family:var(--f-d);font-weight:700;font-size:46px;line-height:1;letter-spacing:-0.03em;margin-top:6px;}
.wp-date{font-size:12px;font-weight:600;opacity:.85;text-transform:capitalize;}
.wp-card{margin-top:auto;background:#fff;color:#0C2644;border-radius:16px;padding:10px;text-align:center;width:100%;}
.wp-card b{display:flex;align-items:center;justify-content:center;gap:5px;color:#C2181F;font-size:11.5px;}
.wp-card b svg{width:13px;height:13px;}
.wp-card .qrb{width:108px;height:108px;margin:6px auto 4px;}
.wp-card .qrb svg{width:100%;height:100%;}
.wp-card small{font-size:9.5px;color:#5B6E83;display:block;line-height:1.3;}
.swatches{display:flex;gap:10px;margin:14px 0 18px;justify-content:center;}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);}
.dl-list{display:grid;gap:12px;}
.dl{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--sky-2);}
.dl .ico{width:46px;height:46px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none;}
.dl .ico svg{width:22px;height:22px;}
.dl div{flex:1;min-width:0;}
.dl strong{display:block;font-size:15px;}
.dl span{font-size:13.5px;color:var(--muted);}
.okbanner{display:flex;gap:14px;align-items:center;padding:18px 20px;border-radius:18px;background:var(--green-soft);margin-bottom:24px;}
.okbanner .ico{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;}
.okbanner .ico svg{width:22px;height:22px;}
.okbanner strong{display:block;font-size:16px;}
.okbanner span{font-size:14px;color:var(--muted);}

.hist{display:grid;gap:10px;}
.hrow{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);}
.hrow .dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;}
.hrow .dot svg{width:18px;height:18px;}
.hrow .dot.info{background:var(--blue-soft);color:var(--blue);}
.hrow .dot.warn{background:var(--amber-soft);color:var(--amber);}
.hrow .dot.crit{background:var(--red-soft);color:var(--red);}
.hrow .dot.ok{background:var(--green-soft);color:var(--green);}
.hrow div{flex:1;min-width:0;}
.hrow strong{display:block;font-size:15px;}
.hrow span{font-size:13.5px;color:var(--muted);}
.hrow time{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;}
.seal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:6px 12px;border-radius:999px;}
.pill svg{width:14px;height:14px;}
.pill.ok{background:var(--green-soft);color:var(--green);}
.pill.bad{background:var(--red-soft);color:var(--red);}
.pill.warn{background:var(--amber-soft);color:var(--amber);}
.pill.blue{background:var(--blue-soft);color:var(--blue);}

/* Public */
.pub{padding:56px 0 70px;}
.pub-in{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
@media (max-width:900px){.pub-in{grid-template-columns:1fr;}}
.pub-card{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:40px 34px;text-align:center;box-shadow:var(--shadow);max-width:470px;margin:0 auto;width:100%;}
.pub-url{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--sky-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;}
.pub-url svg{width:13px;height:13px;color:var(--green);}
.pub-shield{width:110px;height:110px;margin:28px auto 18px;}
.pub-card h1{font-size:30px;font-weight:800;}
.pub-valid{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:800;font-size:14.5px;margin-top:10px;}
.pub-valid svg{width:17px;height:17px;}
.pub-card p.m{color:var(--muted);margin-top:14px;font-size:15.5px;}
.pub-btns{display:grid;gap:10px;margin-top:28px;}
.pub-btns .btn{width:100%;}
.pub-txt h2{font-size:clamp(30px,3.6vw,44px);font-weight:800;letter-spacing:-0.035em;}
.pub-txt>p{color:var(--muted);font-size:17.5px;margin-top:14px;max-width:48ch;}
.pub-txt .sec-cmp{margin-top:28px;}
.watch{margin-top:24px;border-radius:22px;padding:24px;background:var(--surface);border:1px solid var(--line);}
.watch h3{font-size:18px;display:flex;align-items:center;gap:10px;}
.watch p{color:var(--muted);font-size:15px;margin-top:6px;}
.verdict{margin-top:16px;padding:16px 18px;border-radius:16px;background:var(--red-soft);}
.verdict strong{color:var(--red);display:flex;gap:8px;align-items:center;}
.verdict strong svg{width:18px;height:18px;}
.verdict p{margin-top:6px;font-size:14.5px;}

/* Médecin */
.dgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;align-items:start;padding-top:30px;padding-bottom:60px;}
.dgrid>*{min-width:0;}
@media (max-width:1000px){.dgrid{grid-template-columns:1fr;}}
.illu-card{background:transparent;border:1px solid var(--line);border-radius:24px;padding:26px;}
.illu-card svg.illu{width:100%;height:auto;max-height:240px;}
.illu-card h3{font-size:18px;margin-top:10px;}
.checklist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:12px;}
.checklist li{display:flex;gap:12px;align-items:flex-start;font-size:15px;}
.checklist .ck{width:28px;height:28px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none;}
.checklist .ck svg{width:15px;height:15px;}
.checklist span.d{display:block;color:var(--muted);font-size:13.5px;}
.upl{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;border:1.5px dashed var(--line);background:var(--sky-2);}
.upl-prev{width:96px;height:62px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);overflow:hidden;flex:none;}
.upl-prev img{width:100%;height:100%;object-fit:cover;}
.upl-prev svg{width:26px;height:26px;}
.upl p{font-size:13.5px;color:var(--muted);margin-top:6px;}
.agree{display:flex;gap:12px;align-items:flex-start;margin-top:22px;font-size:14.5px;padding:14px;border-radius:14px;background:var(--sky-2);}
.agree input{width:20px;height:20px;accent-color:var(--blue);margin-top:2px;flex:none;}
.admin{margin-top:24px;border-radius:22px;border:2px dashed var(--amber);padding:22px;background:var(--amber-soft);}
.admin h3{font-size:17px;display:flex;align-items:center;gap:10px;}
.admin h3 svg{width:20px;height:20px;color:var(--amber);}
.admin p{font-size:14.5px;color:var(--muted);margin-top:6px;}
.admin .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.ai-note{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--surface);font-size:14.5px;border:1px solid var(--line);}
.ai-note b{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:13px;margin-bottom:4px;}
.ai-note b svg{width:14px;height:14px;}
.wait{display:flex;gap:18px;align-items:center;}
.wait .clock{width:66px;height:66px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;flex:none;}
.wait .clock svg{width:32px;height:32px;}

.verify{display:grid;gap:12px;margin-top:6px;}
.vrow{display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;border:1.5px solid var(--line);background:var(--sky-2);transition:border-color .2s,background .2s;}
.vrow .vi{width:50px;height:50px;border-radius:14px;background:var(--surface);color:var(--muted);display:grid;place-items:center;flex:none;border:1px solid var(--line);}
.vrow .vi svg{width:24px;height:24px;}
.vrow div{flex:1;min-width:0;}
.vrow strong{display:block;font-size:16px;}
.vrow span{font-size:14px;color:var(--muted);}
.vrow .st{flex:none;width:32px;height:32px;display:grid;place-items:center;}
.vrow .st svg{width:24px;height:24px;}
.vrow.run{border-color:var(--blue);background:var(--surface);}
.vrow.run .vi{color:var(--blue);}
.vrow.ok{border-color:var(--green);background:var(--green-soft);}
.vrow.ok .vi{color:var(--green);}
.vrow.ok .st{color:var(--green);}
.vrow.fail{border-color:var(--red);background:var(--red-soft);}
.vrow.fail .vi{color:var(--red);}
.vrow.fail .st{color:var(--red);}
.spin{width:24px;height:24px;border-radius:50%;border:3px solid var(--blue-soft);border-top-color:var(--blue);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.decision{margin-top:18px;padding:20px;border-radius:18px;display:flex;gap:16px;align-items:center;}
.decision .big{font-family:var(--f-d);font-weight:800;font-size:34px;line-height:1;flex:none;}
.decision strong{display:block;font-size:17px;}
.decision span{font-size:14px;}
.decision.ok{background:var(--green);color:#fff;}
.decision.bad{background:var(--red);color:#fff;}
.decision.ok span,.decision.bad span{color:rgba(255,255,255,.88);}
.fraud{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);}
.fraud h3{font-size:16px;}
.fraud p{font-size:14px;color:var(--muted);margin-top:4px;}
.fraud .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}

.sess{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:20px;padding:14px 18px;margin-top:26px;}
.sess .av{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;}
.sess strong{display:block;}
.sess small{color:#BBC9DA;font-size:13px;}
.sess .ok{display:inline-flex;align-items:center;gap:6px;background:rgba(18,161,80,.22);color:#6EE7A3;font-weight:800;font-size:13px;padding:6px 11px;border-radius:999px;margin-left:auto;}
.sess .ok svg{width:14px;height:14px;}
.sess .tm{font-variant-numeric:tabular-nums;font-size:14px;color:#BBC9DA;}
.sess .btn{background:transparent;border-color:rgba(255,255,255,.25);color:#fff;}
@media (max-width:700px){.sess .ok{margin-left:0;}}

.scan{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:36px;}
@media (max-width:760px){.scan{grid-template-columns:1fr;justify-items:center;text-align:center;padding:26px;}}
.scan-frame{--c:var(--blue);width:200px;height:200px;border-radius:22px;display:grid;place-items:center;position:relative;background:
 transparent top left/46px 5px no-repeat,transparent top left/5px 46px no-repeat,
 transparent top right/46px 5px no-repeat,transparent top right/5px 46px no-repeat,
 transparent bottom left/46px 5px no-repeat,transparent bottom left/5px 46px no-repeat,
 transparent bottom right/46px 5px no-repeat,transparent bottom right/5px 46px no-repeat,var(--sky);}
.scan-frame svg{width:110px;height:110px;opacity:.9;}
.scan-frame::after{content:"";position:absolute;left:14px;right:14px;height:3px;background:var(--red);box-shadow:0 0 14px var(--red);top:20%;animation:sl 2.2s ease-in-out infinite alternate;}
@keyframes sl{to{top:80%}}
@media (prefers-reduced-motion:reduce){.scan-frame::after,.badge i::after{animation:none;}}
.scan h2{font-size:30px;}
.scan .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
@media (max-width:760px){.scan .row{justify-content:center;}}
.manual{display:flex;gap:8px;margin-top:16px;max-width:440px;}
.manual input{flex:1;min-width:0;}

/* Dossier patient */
.file{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;margin-top:22px;}
.file>*{min-width:0;}
@media (max-width:1000px){.file{grid-template-columns:1fr;}}
.idcard{display:flex;gap:22px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow);}
.idcard .avatar{width:120px;height:120px;font-size:40px;border-color:var(--blue);box-shadow:none;}
.idcard h2{font-size:clamp(26px,3vw,34px);font-weight:800;}
.idcard .meta{color:var(--muted);margin-top:4px;font-size:16px;}
.idcard .conf{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:var(--amber-soft);color:var(--amber);font-weight:800;font-size:13.5px;padding:7px 12px;border-radius:999px;}
.idcard .conf svg{width:16px;height:16px;}
@media (max-width:560px){.idcard{flex-direction:column;text-align:center;}}
.vit{display:grid;grid-template-columns:170px 1fr;gap:14px;margin-top:14px;}
@media (max-width:560px){.vit{grid-template-columns:1fr;}}
.bt{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;display:flex;flex-direction:column;justify-content:center;}
.bt span{font-weight:700;color:var(--muted);font-size:14px;}
.bt strong{font-family:var(--f-d);font-size:58px;font-weight:800;color:var(--red);line-height:1.05;letter-spacing:-0.04em;}
.al-box{background:var(--red);color:#fff;border-radius:22px;padding:20px 22px;}
.al-box.none{background:var(--surface);color:var(--muted);border:1px solid var(--line);}
.al-box h3{font-family:var(--f-b);font-size:14.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.al-box h3 svg{width:20px;height:20px;}
.al-box .l{font-family:var(--f-d);font-weight:800;font-size:28px;line-height:1.15;margin-top:8px;}
.infos{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;}
.infos .r{display:grid;grid-template-columns:170px 1fr;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);}
.infos .r:last-child{border-bottom:0;}
.infos dt{font-weight:700;color:var(--muted);font-size:14.5px;}
.infos dd{margin:0;font-weight:700;}
@media (max-width:560px){.infos .r{grid-template-columns:1fr;gap:2px;}}
.fam{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px 22px;}
.fam h3{font-size:16px;padding:14px 0 6px;}
.fam .r{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
.fam .r div{flex:1;min-width:0;}
.fam strong{display:block;}
.fam span{font-size:14px;color:var(--muted);}
.call{display:inline-flex;align-items:center;gap:7px;background:var(--green);color:#fff;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;text-decoration:none;}
.call svg{width:16px;height:16px;}
.side{display:grid;gap:14px;align-content:start;}
.alert-btn{border:0;border-radius:24px;padding:24px;background:var(--red);color:#fff;text-align:left;display:flex;gap:16px;align-items:center;box-shadow:0 18px 30px -18px var(--red);}
.alert-btn:hover{background:var(--red-2);}
.alert-btn .ico{width:56px;height:56px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none;}
.alert-btn .ico svg{width:28px;height:28px;}
.alert-btn strong{display:block;font-family:var(--f-d);font-size:21px;}
.alert-btn span{font-size:14px;opacity:.92;}
.alert-btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;}
.aic{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;}
.aic h3{font-size:17px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.aitag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-b);font-size:12px;font-weight:800;color:var(--blue);background:var(--blue-soft);padding:4px 9px;border-radius:999px;}
.aitag svg{width:12px;height:12px;}
.aic p.s{margin-top:10px;font-size:15px;}
.alist{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;}
.alist li{display:flex;gap:9px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;}
.alist li svg{width:16px;height:16px;flex:none;margin-top:3px;}
.alist li.critique{background:var(--red-soft);color:var(--red);}
.alist li.attention{background:var(--amber-soft);color:var(--amber);}
.avoid{margin-top:12px;font-size:14px;color:var(--muted);}
.avoid b{color:var(--red);}
.small{font-size:12.5px;color:var(--muted);margin-top:12px;}
.thinking{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin-top:12px;}
.thinking .spin{width:18px;height:18px;border-width:2.5px;}
.drug{display:flex;gap:8px;margin-top:12px;}
.drug input{flex:1;min-width:0;}
.dres{margin-top:12px;padding:14px;border-radius:14px;font-size:14.5px;}
.dres strong{display:flex;align-items:center;gap:7px;font-size:15.5px;margin-bottom:3px;}
.dres strong svg{width:18px;height:18px;}
.dres.contre{background:var(--red-soft);color:var(--red);}
.dres.prudence{background:var(--amber-soft);color:var(--amber);}
.dres.ok{background:var(--green-soft);color:var(--green);}
.dres p{color:var(--ink);}

/* Modal */
.ov{position:fixed;inset:0;z-index:90;background:rgba(9,23,38,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
.modal{width:100%;max-width:720px;max-height:100%;overflow:auto;background:var(--surface);border-radius:28px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);}
.mh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 26px;background:var(--surface);border-bottom:1px solid var(--line);}
.mh h2{font-size:22px;font-weight:800;}
.mb{padding:26px;}
@media (max-width:560px){.mb{padding:20px;}.mh{padding:16px 20px;}}
.x{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;}
.x svg{width:18px;height:18px;}
.place{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center;padding:14px;border-radius:20px;background:var(--sky-2);border:1px solid var(--line);}
@media (max-width:560px){.place{grid-template-columns:1fr;}}
.map{height:130px;border-radius:14px;overflow:hidden;}
.map svg{width:100%;height:100%;display:block;}
.place strong{display:block;font-size:17px;}
.place span{display:block;font-size:14px;color:var(--muted);}
.place a{font-size:14px;font-weight:700;color:var(--blue);}
.msg{margin-top:14px;border-radius:18px;border:1px solid var(--line);padding:16px 18px;}
.msg h3{font-size:15px;font-family:var(--f-b);font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.msg h3 .t{display:flex;align-items:center;gap:8px;}
.msg h3 .t svg{width:18px;height:18px;color:var(--blue);}
.msg p.body{margin-top:10px;font-size:15px;background:var(--sky-2);border-radius:14px;padding:12px 14px;}
.priv{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;color:var(--muted);}
.priv svg{width:18px;height:18px;flex:none;color:var(--green);margin-top:2px;}
.order{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.order span{display:inline-flex;align-items:center;gap:8px;background:var(--sky-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;font-size:14px;}
.order span i{width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-style:normal;display:grid;place-items:center;font-size:12.5px;}
.tl{list-style:none;margin:0;padding:0;}
.tl li{position:relative;padding:0 0 22px 50px;}
.tl li::before{content:"";position:absolute;left:17px;top:38px;bottom:4px;width:2px;background:var(--line);}
.tl li:last-child::before{display:none;}
.tl .d{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sky);color:var(--muted);}
.tl .d svg{width:17px;height:17px;}
.tl li.done .d{background:var(--green);color:#fff;}
.tl li.run .d{background:var(--blue);color:#fff;}
.tl li.fail .d{background:var(--red);color:#fff;}
.tl strong{display:block;font-size:16px;padding-top:6px;}
.tl span.s{font-size:14px;color:var(--muted);}
.sms{margin-top:10px;background:var(--sky);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:14px;max-width:470px;}
.callbox{margin-top:12px;border-radius:20px;background:var(--navy);color:#fff;padding:18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.callbox .cav{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-family:var(--f-d);font-weight:800;position:relative;flex:none;}
.callbox .cav.ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #6EE7A3;animation:ring 1.1s ease-out infinite;}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
.callbox .cw{flex:1;min-width:180px;}
.callbox strong{display:block;}
.callbox small{color:#6EE7A3;font-weight:700;font-size:13.5px;}
.wave{display:flex;gap:3px;align-items:center;height:26px;margin-top:6px;}
.wave i{width:3px;height:5px;border-radius:3px;background:#6EE7A3;}
.wave.on i{animation:wv .9s ease-in-out infinite;}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}
@keyframes wv{0%,100%{height:5px}50%{height:24px}}
.callbox .tr{width:100%;font-size:14px;color:#D7E9FD;font-style:italic;}
.callbox .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;}
.success{text-align:center;padding:10px 0 4px;}
.success .ico{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 0 0 10px var(--green-soft);}
.success .ico svg{width:42px;height:42px;}
.success h3{font-size:24px;}
.success p{color:var(--muted);margin-top:6px;}
.video{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:380px;margin:0 auto;}
.video video{width:100%;height:100%;object-fit:cover;}
.video .fr{position:absolute;inset:18%;border:4px solid #fff;border-radius:18px;}
.cam-msg{text-align:center;color:var(--muted);margin-top:14px;font-size:15px;}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;gap:8px;width:min(92vw,480px);pointer-events:none;}
.toast{background:var(--navy);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;font-size:14.5px;text-align:center;box-shadow:0 16px 30px -12px rgba(0,0,0,.4);animation:tin .2s ease-out;}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.demo{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--amber-soft);color:var(--amber);vertical-align:middle;}

/* ===== Direction visuelle v3 ===== */
body{background:#E9F3FE;background-attachment:scroll;}
@media (max-width:0px){:root:not([data-theme="light"]) body{background:#0B2037;}}
:root[data-theme="dark"] body{background:#0B2037;}
h1,h2,h3,h4{letter-spacing:-0.035em;}
.grad{background:transparent;-webkit-background-clip:text;background-clip:text;color:transparent;}
.nav{background:color-mix(in srgb,var(--surface) 85%,transparent);}
.btn{border-radius:14px;}
.btn-blue{background:#227CE2;box-shadow:0 12px 24px -14px var(--blue);}
.btn-red{background:transparent;box-shadow:0 12px 24px -12px rgba(229,57,53,.7);}
.btn-red:hover{background:transparent;}
.card,.side-card,.idcard,.infos,.fam,.aic,.cmp,.space,.step,.pub-card,.watch{border-radius:28px;border-color:var(--line);box-shadow:0 20px 40px -30px rgba(28,112,209,.35);}
.badge{gap:10px;padding:8px 16px 8px 12px;box-shadow:0 6px 18px -12px rgba(28,112,209,.4);}
.badge svg{width:18px;height:18px;color:var(--green);}
.hero{background:none;}
.hero-in{grid-template-columns:1fr 1fr;padding-top:56px;padding-bottom:40px;gap:56px;}
.hero h1{font-size:clamp(36px,4.4vw,58px);font-weight:800;letter-spacing:-0.045em;line-height:1.04;max-width:16ch;}
.hero .lead{font-size:clamp(17px,1.5vw,19px);}
.photo-card{position:relative;padding-bottom:44px;}
.photo-card img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:30% 50%;border-radius:34px;box-shadow:0 40px 70px -40px rgba(12,33,56,.55);}
.float{position:absolute;display:flex;gap:14px;align-items:center;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:14px 18px;box-shadow:0 20px 40px -24px rgba(12,33,56,.45);}
.float .fi{width:48px;height:48px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none;}
.float .fi svg{width:22px;height:22px;}
.float strong{display:block;font-size:16px;letter-spacing:-0.01em;}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const genUid=()=>{const a=new Uint8Array(8);crypto.getRandomValues(a);return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();};
const hosp=id=>{if(id==='autre'){const d=(typeof S!=='undefined'&&S.doctor)||{};const n=(d.hopAutreNom||'').trim()||'Mon hôpital';return{id:'autre',nom:n,lieu:(d.hopAutreVille||'').trim(),lat:d.hopAutreLat??null,lng:d.hopAutreLng??null,ssid:'WIFI-'+norm(n).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').toUpperCase().slice(0,18),custom:true};}return HOSPITALS.find(h=>h.id===id)||HOSPITALS[0];};
const fAutre=()=>R.fAutre||(!!S.doctor.fonction&&!FONCTIONS.includes(S.doctor.fonction));
const initials=(a,b)=>(((a||'?')[0]||'?')+((b||'')[0]||'')).toUpperCase();
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmtT=ts=>new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const fmtD=ts=>new Date(ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmtDist=m=>m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1).replace('.',',')} km`;
function age(d){if(!d)return null;const b=new Date(d);if(isNaN(b))return null;const n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a;}
function haversine(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dg=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function toast(m){const w=$('#toasts');while(w.children.length>=1)w.firstChild.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;w.appendChild(t);setTimeout(()=>t.remove(),3000);}

/* État */
function defaults(){return{
  patient:{uid:genUid(),prenom:'',nom:'',naissance:'',sexe:'',tel:'',ville:'',photo:'',groupe:'',allergies:[],maladies:[],traitements:[],notes:'',contacts:[]},
  doctor:{prenom:'',nom:'',ordre:'',fonction:'',hopitalId:'chu-so',tel:'',carte:'',attest:false,status:'none',aiCheck:null,photo:''},
  audit:[],wp:'bleu'};}
function load(){const d=defaults();try{const r=localStorage.getItem(LS_KEY);if(r){const s=JSON.parse(r);return Object.assign(d,s,{patient:Object.assign(d.patient,s.patient||{}),doctor:Object.assign(d.doctor,s.doctor||{}),audit:Array.isArray(s.audit)?s.audit:[]});}}catch(e){}return d;}
let S=load();

/* Comptes : inscription et connexion
   Mode "cloud" dès que SB_URL et SB_KEY sont renseignés (Supabase), sinon mode local (ce navigateur). */
const SB_URL='';   // ex. https://xxxx.supabase.co
const SB_KEY='';   // clé publishable (anon) du projet
const ACC_LS='bs_accounts_v1',SES_LS='bs_session_v1';
const A={user:null,mode:(SB_URL&&SB_KEY)?'cloud':'local',sb:null,state:'idle',t:null};
const snapshot=()=>JSON.parse(JSON.stringify({patient:S.patient,doctor:S.doctor,audit:S.audit,wp:S.wp,role:S.role||'',sec:S.sec||null}));
function fromSnap(d){const x=defaults();d=d||{};return Object.assign(x,d,{patient:Object.assign(x.patient,d.patient||{}),doctor:Object.assign(x.doctor,d.doctor||{}),audit:Array.isArray(d.audit)?d.audit:[]});}
const accAll=()=>{try{return JSON.parse(localStorage.getItem(ACC_LS)||'{}');}catch(e){return{};}};
function accPut(o){try{localStorage.setItem(ACC_LS,JSON.stringify(o));return true;}catch(e){toast('Mémoire du navigateur pleine : retirez une photo puis réessayez.');return false;}}
async function pwHash(pw,salt){try{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:120000,hash:'SHA-256'},k,256);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){return sha(salt+'|'+pw);}}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('script'));document.head.appendChild(s);});}
async function sbc(){if(A.sb)return A.sb;if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');A.sb=window.supabase.createClient(SB_URL,SB_KEY);return A.sb;}
const cleanMail=e=>String(e||'').trim().toLowerCase();
function mailOk(e){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);}
function authErr(m){m=String(m||'');if(/already|registered|exists/i.test(m))return'Un compte existe déjà avec cet e-mail. Connectez-vous.';if(/invalid login|credentials/i.test(m))return'E-mail ou mot de passe incorrect.';if(/confirm/i.test(m))return'Confirmez d\'abord votre adresse e-mail (lien reçu par e-mail).';if(/network|fetch|script/i.test(m))return'Connexion au serveur impossible. Vérifiez votre connexion internet.';return m||'Une erreur est survenue.';}
async function accSignUp(email,pw){
  email=cleanMail(email);
  if(A.mode==='cloud'){const sb=await sbc();const r=await sb.auth.signUp({email,password:pw});if(r.error)throw new Error(authErr(r.error.message));if(!r.data.session)throw new Error('Compte créé. Ouvrez le lien de confirmation reçu par e-mail, puis connectez-vous.');A.user={email,id:r.data.user.id};await cloudSave(true);}
  else{const all=accAll();if(all[email])throw new Error('Un compte existe déjà avec cet e-mail. Connectez-vous.');const salt=genUid()+Date.now();all[email]={salt,hash:await pwHash(pw,salt),created:Date.now(),data:snapshot()};if(!accPut(all))throw new Error('Enregistrement impossible.');A.user={email};localStorage.setItem(SES_LS,email);}
  A.state='saved';
}
async function accSignIn(email,pw){
  email=cleanMail(email);
  if(A.mode==='cloud'){const sb=await sbc();const r=await sb.auth.signInWithPassword({email,password:pw});if(r.error)throw new Error(authErr(r.error.message));A.user={email,id:r.data.user.id};const q=await sb.from('profiles').select('data').eq('user_id',A.user.id).maybeSingle();S=fromSnap(q.data?.data);}
  else{const a=accAll()[email];if(!a||await pwHash(pw,a.salt)!==a.hash)throw new Error('E-mail ou mot de passe incorrect.');A.user={email};localStorage.setItem(SES_LS,email);S=fromSnap(a.data);}
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}A.state='saved';
}
async function accSignOut(){if(A.mode==='cloud'&&A.sb){try{await A.sb.auth.signOut();}catch(e){}}A.user=null;try{localStorage.removeItem(SES_LS);localStorage.removeItem(LS_KEY);}catch(e){}S=defaults();Object.assign(R,{unlocked:false,pinErr:'',pstep:1,err:{},auth:false,check:null,docEdit:false,fileOpen:false,summary:null,drug:null,alert:null});}
async function cloudSave(now){if(!A.sb||!A.user?.id)return;A.state='saving';const r=await A.sb.from('profiles').upsert({user_id:A.user.id,email:A.user.email,data:snapshot(),updated_at:new Date().toISOString()});A.state=r.error?'error':'saved';paintSaved();}
function persist(){if(!A.user)return;clearTimeout(A.t);A.state='saving';paintSaved();A.t=setTimeout(async()=>{if(A.mode==='cloud'){try{await cloudSave();}catch(e){A.state='error';paintSaved();}}else{const all=accAll();if(all[A.user.email]){all[A.user.email].data=snapshot();A.state=accPut(all)?'saved':'error';}paintSaved();}},700);}
function savedTxt(){return A.state==='saving'?'Enregistrement…':A.state==='error'?'Échec de l\'enregistrement':'Tout est enregistré';}
function paintSaved(){document.querySelectorAll('.acc-st').forEach(el=>{el.textContent=savedTxt();el.dataset.s=A.state;});}
async function accBoot(){try{if(A.mode==='cloud'){const sb=await sbc();const{data}=await sb.auth.getSession();if(data.session){A.user={email:data.session.user.email,id:data.session.user.id};const q=await sb.from('profiles').select('data').eq('user_id',A.user.id).maybeSingle();if(q.data)S=fromSnap(q.data.data);A.state='saved';render();}}else{const e=localStorage.getItem(SES_LS);if(e&&accAll()[e]){A.user={email:e};A.state='saved';}}}catch(e){}}

async function authGo(){authGrab();const M=R.authM,su=M.tab==='signup',mail=cleanMail(M.mail),pw=$('#au-pw').value,pw2=su?$('#au-pw2').value:pw;
 if(su&&(!M.prenom.trim()||!M.nom.trim())){M.err='Indiquez votre prénom et votre nom.';render();return;}
 if(!mailOk(mail)){M.err='Adresse e-mail invalide.';render();return;}
 if(pw.length<8){M.err=su?'Le mot de passe doit contenir au moins 8 caractères.':'Mot de passe incorrect.';render();return;}
 if(su&&pw!==pw2){M.err='Les deux mots de passe ne correspondent pas.';render();return;}
 M.busy=true;M.err='';render();
 try{
  if(su){S=defaults();S.role=M.role;const who=M.role==='medecin'?S.doctor:S.patient;who.prenom=M.prenom.trim();who.nom=M.nom.trim();await accSignUp(mail,pw);}

  log('Vous',su?'Compte créé':'Connexion au compte',mail,'info');
 }catch(e){M.busy=false;M.err=authErr(e.message);render();}}
async function authForgot(){authGrab();const M=R.authM,mail=cleanMail(M.mail);if(!mailOk(mail)){M.err='Entrez d\'abord votre adresse e-mail.';render();return;}
 if(A.mode==='cloud'){try{const sb=await sbc();await sb.auth.resetPasswordForEmail(mail);toast('Un lien de réinitialisation a été envoyé à '+mail+'.');}catch(e){toast('Envoi impossible pour le moment.');}}
 else toast('En mode démonstration, la réinitialisation par e-mail n\'est pas disponible. Créez un nouveau compte.');}
function gate(role){return `<section class="wrap gate"><div class="gate-card">${ic(role==='medecin'?'steth':'lock')}<h1>${role==='medecin'?'Espace réservé aux soignants':'Votre espace patient'}</h1><p>${role==='medecin'?'Créez votre compte professionnel ou connectez-vous pour accéder aux dossiers d\'urgence.':'Créez votre compte ou connectez-vous pour remplir et retrouver votre carte d\'urgence.'}</p><div class="cta" style="justify-content:center"><button class="btn btn-blue btn-lg" data-a="authOpen" data-t="signup" data-r="${role}">Créer mon compte</button><button class="btn btn-line btn-lg" data-a="authOpen" data-t="login" data-r="${role}">Se connecter</button></div></div></section>`;}

function pinStep(){const has=!!(S.sec&&S.sec.pinHash);
 return `<h2>Mon code PIN</h2><p class="sub">Ce code à 4 chiffres protège votre carte. Il est demandé à chaque ouverture de votre espace sur ce téléphone, pour que personne d'autre ne puisse voir ou modifier vos informations.</p>

 :`<div class="pin-box"><label class="field"><span class="l">${has?'Nouveau code PIN':'Choisissez un code PIN'}</span><input id="pin1" class="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></label><label class="field"><span class="l">Confirmez le code PIN</span><input id="pin2" class="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"></label></div>
 ${R.pinErr?`<p class="au-err" role="alert">${ic('alert')}<span>${esc(R.pinErr)}</span></p>`:''}
 <p class="fhint">Évitez les codes trop simples comme 0000 ou 1234, et votre année de naissance.</p>

async function pinSave(){const a=$('#pin1').value,b=$('#pin2').value;
 if(!/^\d{4}$/.test(a)){R.pinErr='Le code PIN doit contenir exactement 4 chiffres.';render();return;}
 if(a!==b){R.pinErr='Les deux codes ne correspondent pas.';render();return;}
 if(/^(\d)\1{3}$/.test(a)||['1234','4321','0123','9876'].includes(a)){R.pinErr='Ce code est trop simple. Choisissez-en un autre.';render();return;}
 const salt=genUid();S.sec={pinHash:await pwHash(a,salt),salt};R.pinErr='';R.pinEdit=false;R.unlocked=true;R.pstep=5;save();render();window.scrollTo(0,0);toast('Tout est enregistré. Votre carte est prête.');log('Vous','Code PIN défini','Espace patient protégé','info');}
function pinLock(){return `<section class="wrap gate"><div class="gate-card">${ic('lock')}<h1>Entrez votre code PIN</h1><p>Bonjour ${esc(S.patient.prenom||'')} ! Votre espace est protégé.</p>

async function pinUnlock(){const v=$('#pinu').value;if(!/^\d{4}$/.test(v)){R.pinErr='Entrez vos 4 chiffres.';render();return;}
 if(await pwHash(v,S.sec.salt)===S.sec.pinHash){R.unlocked=true;R.pinErr='';R.pinTries=0;render();toast('Espace déverrouillé.');return;}
 R.pinTries=(R.pinTries||0)+1;if(R.pinTries>=5){R.pinTries=0;R.pinErr='';await accSignOut();authOpen('login','patient');R.authM.err='Trop d\'essais. Reconnectez-vous avec votre e-mail et votre mot de passe.';render();return;}

const R={view:'accueil',pstep:1,err:{},check:null,auth:false,sessionStart:null,fileOpen:false,summary:null,sumLoading:false,drug:null,drugLoading:false,alert:null,scanner:null,burst:null,verify:null,adminAI:false,pubLogged:false};
const getP=p=>p.split('.').reduce((o,k)=>o?.[k],S);
function setP(p,v){const k=p.split('.');const l=k.pop();k.reduce((o,k)=>o[k],S)[l]=v;}

/* Journal chaîné SHA-256 */
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(16).padStart(8,'0').repeat(8);}}
const estr=e=>[e.prev,e.ts,e.who,e.what,e.detail,e.lv].join('|');
let q=Promise.resolve();
function log(who,what,detail='',lv='info'){q=q.then(async()=>{const prev=S.audit.length?S.audit[S.audit.length-1].hash:'GENESIS';const e={ts:Date.now(),who,what,detail,lv,prev};e.hash=await sha(estr(e));S.audit.push(e);if(S.audit.length>200)S.audit=S.audit.slice(-200);save();if(R.view==='patient'&&R.pstep===6)render();});return q;}
async function verifyChain(){let prev=S.audit.length?S.audit[0].prev:'GENESIS';for(let i=0;i<S.audit.length;i++){const e=S.audit[i];if(e.prev!==prev||await sha(estr(e))!==e.hash)return{ok:false,at:i};prev=e.hash;}return{ok:true,n:S.audit.length};}

/* QR */

function qrData(text){if(typeof window.qrcode!=='function')return null;const q=window.qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let d='';for(let r=0;r<n;r++){let c=0;while(c<n){if(q.isDark(r,c)){let e=c;while(e<n&&q.isDark(r,e))e++;d+=`M${c+m} ${r+m}h${e-c}v1h-${e-c}z`;c=e;}else c++;}}return{d,s:n+m*2,n,q};}

/* Espace patient */
const PSTEPS=[[1,'Mes informations'],[2,'Ma santé'],[3,'Mes proches'],[4,'Code PIN'],[5,'Ma carte QR'],[6,'Historique']];
const pDone={1:()=>!!(S.patient.prenom&&S.patient.nom&&S.patient.tel),2:()=>!!S.patient.groupe,3:()=>S.patient.contacts.length>0,4:()=>!!(S.sec&&S.sec.pinHash),5:()=>pDone[1]()&&pDone[3]()&&pDone[4](),6:()=>false};
function completeness(){const p=S.patient;const it=[p.prenom,p.nom,p.naissance,p.tel,p.photo,p.groupe,p.contacts.length>0,p.contacts.length>1];return Math.round(it.filter(Boolean).length/it.length*100);}
function fld(label,path,o={}){
  const v=o.val!==undefined?o.val:(getP(path)??''),e=R.err[path];
  const h=e?`<span class="h">${esc(e)}</span>`:(o.hint?`<span class="h">${o.hint}</span>`:'');
  if(o.sel)return `<label class="field ${e?'err':''}"><span class="l">${label}</span><select data-bind="${path}">${o.sel.map(x=>{const val=typeof x==='string'?x:x.v,lab=typeof x==='string'?x:x.l;return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(lab)}</option>`;}).join('')}</select>${h}</label>`;
  if(o.area)return `<label class="field"><span class="l">${label}</span><textarea data-bind="${path}" placeholder="${esc(o.ph||'')}">${esc(v)}</textarea>${h}</label>`;
  return `<label class="field ${e?'err':''}"><span class="l">${label}</span><input type="${o.type||'text'}" data-bind="${path}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.attr||''}>${h}</label>`;
}
function photoBtns(key,has){return `<div class="pbtns"><span class="btn btn-blue btn-sm fbtn">${ic('camera')}Prendre une photo<input type="file" accept="image/*" capture="user" data-file="${key}" aria-label="Prendre une photo"></span><span class="btn btn-line btn-sm fbtn">${ic('user')}${has?'Changer la photo':'Choisir dans la galerie'}<input type="file" accept="image/*" data-file="${key}" aria-label="Choisir une photo dans la galerie"></span>${has?`<button class="link" data-a="rmPhoto" data-k="${key}">Retirer</button>`:''}</div><p class="fhint">La galerie ne s'ouvre pas ? Ouvrez cette page dans Chrome ou Safari.</p>`;}
function avatar(p,cls='avatar'){return `<div class="${cls}">${p.photo?`<img src="${p.photo}" alt="Photo de ${esc(p.prenom)}">`:esc(initials(p.prenom,p.nom))}</div>`;}
function pPatient(){
  if(!A.user)return gate('patient');
  if(S.sec&&S.sec.pinHash&&!R.unlocked)return pinLock();
  const pc=completeness();
  return `<section class="phead"><div class="wrap">
    <div class="phead-in"><div><span class="space-pill p"><i>${ic('user')}</i>Espace patient</span><h1>Ma carte d'urgence</h1><p>Remplissez ces informations une seule fois. Elles ne seront visibles que par un médecin vérifié, à l'hôpital.</p></div><button class="btn btn-line btn-sm" data-a="sampleP">Remplir avec un exemple</button></div>
    ${acctBar()}
    <div class="stepper">${PSTEPS.map(([n,l])=>`<button data-a="pstep" data-n="${n}" class="${R.pstep===n?'cur':(pDone[n]()?'done':'')}"><span class="n">${R.pstep!==n&&pDone[n]()?ic('check'):(n===6?ic('history'):n)}</span><span class="t">${l}</span></button>`).join('')}</div>
  </div></section>
  <section class="wrap pgrid">
    <div class="card">${pStepHTML()}</div>
    <aside class="aside">
      ${ecard()}
      <div class="side-card"><div class="prow"><span>Carte complétée</span><span>${pc} %</span></div><div class="progress"><i style="width:${pc}%"></i></div><p style="margin-top:10px">${pc<100?'Plus votre carte est complète, plus les soins sont rapides.':'Votre carte est complète.'}</p></div>
    </aside>
  </section>`;
}
function ecard(){const p=S.patient;return `<div class="ecard"><div class="ec-top"><span class="ec-brand">${logo()}${BRAND}</span><span class="ec-tag">Urgence</span></div>
  <div class="ec-body"><div class="ec-qr">${qrSVG(qrText())}</div><div><strong>${p.prenom?`Carte de ${esc(p.prenom)}`:'Votre carte d\'urgence'}</strong><p>En cas d'urgence, un médecin scanne ce code. Aucune donnée n'est lisible par un passant.</p></div></div>
  <div class="ec-foot"><span>N° ${esc(p.uid.match(/.{1,4}/g).join(' '))}</span><span>${p.groupe?`Groupe ${esc(p.groupe)}`:''}</span></div></div>`;}
function nextBtns(prev,next,nextLabel){return `<div class="actions">${prev?`<button class="btn btn-line" data-a="pstep" data-n="${prev}">${ic('back')}Retour</button>`:'<span></span>'}<div class="right">${next?`<button class="btn btn-blue btn-lg" data-a="pnext" data-n="${next}">${nextLabel} ${ic('arrow')}</button>`:''}</div></div>`;}
function chipsFor(key,list,cls=''){const cur=S.patient[key];const extra=cur.filter(x=>!list.some(l=>norm(l)===norm(x)));return `<div class="chips">${[...list,...extra].map(x=>{const on=cur.some(c=>norm(c)===norm(x));return `<button class="chip ${cls}" aria-pressed="${on}" data-a="toggle" data-k="${key}" data-v="${esc(x)}">${on?ic('check'):''}${esc(x)}</button>`;}).join('')}</div><div class="addline"><input class="in" data-add="${key}" placeholder="Autre : écrivez puis Ajouter"><button class="btn btn-line" data-a="addTag" data-k="${key}">Ajouter</button></div>`;}
function pStepHTML(){
  const p=S.patient;
  if(R.pstep===1)return `<h2>Mes informations</h2><p class="sub">Votre photo aide le médecin à vérifier que c'est bien vous.</p>
    <div class="photo">${avatar(p)}<div><strong>Ma photo de visage</strong><p>Le médecin la compare à votre visage pour confirmer que c'est bien vous. De face, récente, bien éclairée.</p>${photoBtns('photo',!!p.photo)}</div></div>
    <div class="grid2">${fld('Prénom','patient.prenom',{ph:'Ex. Crédo'})}${fld('Nom','patient.nom',{ph:'Ex. Ahiafor'})}${fld('Date de naissance','patient.naissance',{type:'date'})}${fld('Sexe','patient.sexe',{sel:[{v:'',l:'Choisir'},'Femme','Homme']})}${fld('Mon numéro de téléphone','patient.tel',{type:'tel',ph:'+228 90 00 00 00'})}${fld('Ville ou quartier','patient.ville',{ph:'Ex. Lomé, Adidogomé'})}</div>
    ${nextBtns(0,2,'Continuer')}`;
  if(R.pstep===2)return `<h2>Ma santé</h2><p class="sub">Touchez simplement ce qui vous concerne. Laissez vide si rien ne s'applique.</p>
    <div class="q"><div class="q-t">Mon groupe sanguin</div><div class="q-h">Indiqué sur votre carte de groupe ou vos analyses.</div><div class="blood">${BLOOD.map(b=>`<button aria-pressed="${p.groupe===b}" data-a="blood" data-v="${b}">${b}</button>`).join('')}</div></div>
    <div class="q"><div class="q-t">Je suis allergique à</div><div class="q-h">Les allergies s'afficheront en rouge pour le médecin.</div>${chipsFor('allergies',ALLERGIES,'al')}</div>
    <div class="q"><div class="q-t">J'ai une maladie connue</div><div class="q-h">Maladies chroniques ou situation particulière.</div>${chipsFor('maladies',MALADIES)}</div>
    <div class="q"><div class="q-t">Je prends un traitement</div><div class="q-h">Médicaments pris régulièrement.</div>${chipsFor('traitements',TRAITEMENTS)}</div>
    <div class="q">${fld('Autre chose à savoir (facultatif)','patient.notes',{area:1,ph:'Ex. porteur d\'un pacemaker, refus de transfusion…'})}</div>
    ${nextBtns(1,3,'Continuer')}`;
  if(R.pstep===3)return `<h2>Mes proches à prévenir</h2><p class="sub">En cas d'urgence, l'IA appellera d'abord le n° 1. S'il ne répond pas, elle passe au suivant.</p>
    ${p.contacts.length?p.contacts.map((c,i)=>`<div class="contact"><span class="c-rank">${i+1}</span><div class="who"><strong>${esc(c.nom)}</strong><span>${esc(c.lien)}, ${esc(c.tel)}</span></div>
      <button class="ib" data-a="cmove" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Monter">${ic('up')}</button><button class="ib" data-a="cmove" data-i="${i}" data-d="1" ${i===p.contacts.length-1?'disabled':''} aria-label="Descendre">${ic('down')}</button><button class="ib" data-a="cdel" data-i="${i}" aria-label="Supprimer">${ic('trash')}</button></div>`).join(''):`<div class="empty">${ic('alert')}<span>Aucun proche pour l'instant. Ajoutez au moins deux personnes joignables à toute heure.</span></div>`}
    <div class="addbox"><div class="q-t" style="margin-bottom:12px">Ajouter un proche</div><div class="grid3">
      <label class="field"><span class="l">Nom complet</span><input id="c-nom" placeholder="Ex. Ama Mensah"></label>
      <label class="field"><span class="l">Lien</span><select id="c-lien">${LIENS.map(l=>`<option>${l}</option>`).join('')}</select></label>
      <label class="field"><span class="l">Téléphone</span><input id="c-tel" type="tel" placeholder="+228 90 00 00 00"></label></div>
      <button class="btn btn-blue" style="margin-top:14px" data-a="addContact">${ic('users')}Ajouter ce proche</button></div>
    ${nextBtns(2,4,'Continuer')}`;
  if(R.pstep===4)return pinStep();
  if(R.pstep===5){
    const ready=pDone[1]()&&pDone[3]();
    return `${ready?`<div class="okbanner"><span class="ico">${ic('check')}</span><div><strong>Votre carte d'urgence est prête</strong><span>Installez le fond d'écran : il reste visible même quand le téléphone est verrouillé.</span></div></div>`:`<div class="empty" style="margin-bottom:24px">${ic('alert')}<span>Il manque ${!pDone[1]()?'votre nom ou votre téléphone':'au moins un proche'}. <button class="link" data-a="pstep" data-n="${!pDone[1]()?1:3}">Compléter</button></span></div>`}
    <h2>Ma carte QR</h2><p class="sub">Le QR code ne contient pas vos données, seulement un numéro unique. Sans médecin vérifié, il ne révèle rien.</p>
    <div class="qr-final"><div>
      <div class="wp ${S.wp}"><div class="wp-date">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="wp-time">${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div><div class="wp-card"><b>${ic('alert')}Urgence médicale, scannez-moi</b><div class="qrb">${qrSVG(qrText())}</div><small>Réservé au personnel soignant.<br>${BRAND}, données protégées.</small></div></div>

    </div>
    <div class="dl-list">
      <div class="dl"><span class="ico">${ic('download')}</span><div><strong>Fond d'écran</strong><span>À définir comme écran de verrouillage</span></div><button class="btn btn-blue btn-sm" data-a="dlWp">Télécharger</button></div>
      <div class="dl"><span class="ico">${ic('qr')}</span><div><strong>Autocollant de secours</strong><span>À coller sur le casque, le portefeuille ou la pièce d'identité. Il prend le relais si le téléphone est cassé, perdu ou déchargé.</span></div><button class="btn btn-line btn-sm" data-a="dlSt">Télécharger</button></div>
      <div class="dl"><span class="ico">${ic('eye')}</span><div><strong>Tester mon QR</strong><span>Voir ce qu'obtient un passant qui le scanne</span></div><button class="btn btn-line btn-sm" data-go="public">Tester</button></div>
      <div class="dl"><span class="ico">${ic('refresh')}</span><div><strong>Téléphone perdu ?</strong><span>Générez un nouveau code, l'ancien ne marchera plus</span></div><button class="btn btn-line btn-sm" data-a="regen">Nouveau code</button></div>
      <div id="dlf"></div>
    </div></div>
    ${nextBtns(4,6,'Voir l\'historique')}`;
  }
  const v=R.verify,rows=[...S.audit].reverse();
  const kind=e=>e.lv==='crit'?['crit','alert']:(e.lv==='warn'?['warn','eye']:(e.lv==='ok'?['ok','check']:['info','history']));
  return `<h2>Qui a consulté mon dossier</h2><p class="sub">Chaque ouverture de votre dossier est enregistrée : qui, où et quand. Personne ne peut effacer ou modifier cet historique.</p>
    <div class="seal"><button class="btn btn-line btn-sm" data-a="verify">${ic('shield')}Vérifier que rien n'a été modifié</button>${v?(v.ok?`<span class="pill ok">${ic('check')}Historique intact (${v.n} entrées)</span>`:`<span class="pill bad">${ic('alert')}Modification détectée</span>`):''}</div>
    ${rows.length?`<div class="hist">${rows.slice(0,30).map(e=>{const[k,i]=kind(e);return `<div class="hrow">${(/^Dr /.test(e.who)&&S.doctor.photo)?`<img class="hph" src="${S.doctor.photo}" alt="Photo de ${esc(e.who)}">`:`<span class="dot ${k}">${ic(i)}</span>`}<div><strong>${esc(e.what)}</strong><span>${esc(e.who)}${e.detail?`. ${esc(e.detail)}`:''}</span></div><time>${fmtD(e.ts)}, ${fmtT(e.ts)}</time></div>`;}).join('')}</div>`:`<div class="empty">${ic('history')}<span>Aucune consultation pour l'instant. Testez le scan public ou le parcours médecin pour voir l'historique se remplir.</span></div>`}
    ${nextBtns(5,0,'')}`;
}

/* Espace médecin */

const CHECKS=[{k:'bio',ic:'finger',t:'Empreinte digitale',d:'Vérifie que c\'est bien vous qui tenez le téléphone.'},{k:'geo',ic:'pin',t:'Présence à l\'hôpital',d:'Le GPS confirme que vous êtes dans l\'enceinte.'},{k:'wifi',ic:'wifi',t:'Réseau de l\'hôpital',d:'Le téléphone doit être sur le Wi-Fi sécurisé de l\'établissement.'},{k:'ia',ic:'spark',t:'Contrôle de l\'IA',d:'Analyse les habitudes de connexion pour repérer une fraude.'}];
function geoAskBox(){const on=!!S.doctor.simGeo,h=hosp(S.doctor.hopitalId),g=R.geo,busy=R.check&&!R.check.result;

 else if(g.state==='asking')body=`<p class="geo-msg"><span class="spin"></span><span>Demande en cours… Acceptez la fenêtre de localisation de votre navigateur.</span></p>`;

 else body=`<p class="geo-msg warn">${ic('alert')}<span>${g.state==='denied'?(window.self!==window.top?'Cet aperçu ne peut pas accéder à votre position. Ouvrez Biosecours depuis son lien Vercel pour la vraie localisation, ou utilisez la simulation ci-dessous.':'Localisation refusée. Autorisez-la dans les réglages du navigateur (icône à gauche de l\'adresse), puis réessayez.'):'Position introuvable. Activez le GPS du téléphone, puis réessayez.'}</span></p><button class="btn btn-line btn-sm" data-a="askGeo">Réessayer</button>`;

function getPos2(){return new Promise(res=>{if(!navigator.geolocation)return res({err:'unavailable'});let done=false;const t=setTimeout(()=>{if(!done){done=true;res({err:'unavailable'});}},12000);navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude});},e=>{if(done)return;done=true;clearTimeout(t);res({err:e&&e.code===1?'denied':'unavailable'});},{enableHighAccuracy:true,timeout:11000,maximumAge:0});});}

 x.fillStyle='#E3EEFA';rr(36,156,200,250,16);x.fill();
 if(ph){x.save();rr(36,156,200,250,16);x.clip();const s2=Math.max(200/ph.width,250/ph.height);x.drawImage(ph,36+(200-ph.width*s2)/2,156+(250-ph.height*s2)/2,ph.width*s2,ph.height*s2);x.restore();}
 else{x.fillStyle='#1F63B5';x.font='800 64px Archivo, Arial, sans-serif';x.textAlign='center';x.fillText((d.prenom[0]+d.nom[0]).toUpperCase(),136,300);x.textAlign='left';}
 const rows=[['Nom',d.nom.toUpperCase()],['Prénom',d.prenom],['Fonction',d.fonction||'Médecin'],['N° d\'ordre',d.ordre],['Établissement',h.nom],['Valide jusqu\'au','31/12/'+(new Date().getFullYear()+2)]];
 let y=166;rows.forEach(([k,v])=>{x.fillStyle='#5A6B80';x.font='600 17px Archivo, Arial, sans-serif';x.fillText(k,270,y);x.fillStyle='#0F2A44';x.font='700 25px Archivo, Arial, sans-serif';let t=String(v);while(x.measureText(t).width>550&&t.length>4)t=t.slice(0,-2)+'…';x.fillText(t,270,y+27);y+=50;});
 x.save();x.translate(W/2,H/2+40);x.rotate(-0.32);x.fillStyle='rgba(211,47,47,.16)';x.font='900 92px Archivo, Arial, sans-serif';x.textAlign='center';x.fillText('SIMULATION',0,0);x.restore();

async function runCheck(fraud=null){
  const h=hosp(S.doctor.hopitalId);
  R.check={st:{},result:null,fraud};render();
  const set=(k,state,msg)=>{R.check.st[k]={state,msg};render();};
  set('bio','run');await sleep(1200);
  if(fraud==='vol'){set('bio','fail','Empreinte non reconnue après 3 essais.');return finish(12,'L\'empreinte ne correspond pas au médecin inscrit. Le médecin est prévenu.');}
  set('bio','ok','Empreinte reconnue.');
  set('geo','run');
  if(fraud==='maison'){await sleep(1100);set('geo','fail','Vous êtes à 7,8 km de l\'hôpital.');set('wifi','fail','Aucun réseau de l\'hôpital détecté.');return finish(18,'Connexion hors de l\'hôpital. Aucun dossier ne peut être ouvert à distance.');}
  if(S.doctor.simGeo){await sleep(900);R.check.geo={lat:h.lat+.0003,lng:h.lng-.0002,d:42,sim:true};set('geo','ok',`Présence simulée au ${h.nom} (environnement de test).`);}
  else{const g=await freshPos();
   if(g&&g.d==null){S.doctor.hopAutreLat=g.lat;S.doctor.hopAutreLng=g.lng;save();R.check.geo={lat:g.lat,lng:g.lng,d:0};set('geo','ok',`Position enregistrée comme emplacement de ${h.nom}, à confirmer par l'administration.`);}
   else if(g&&g.d<=GEOFENCE_M){R.check.geo={lat:g.lat,lng:g.lng,d:g.d};set('geo','ok',`Position confirmée, à ${fmtDist(g.d)} de ${h.nom}.`);}
   else if(g){set('geo','fail',`Vous êtes à ${fmtDist(g.d)} de ${h.nom}.`);return finish(20,'Vous n\'êtes pas dans l\'hôpital. Pour une démonstration, activez l\'environnement de test sous la géolocalisation.');}
   else{set('geo','fail','Position introuvable : la localisation est refusée ou indisponible.');return finish(20,'Autorisez la localisation du téléphone, ou activez l\'environnement de test sous la géolocalisation.');}}
  set('wifi','run');await sleep(1000);set('wifi','ok',`Connecté à ${h.ssid}, réseau sécurisé de l'hôpital.`);
  set('ia','run');await sleep(1100);
  if(fraud==='masse'){set('ia','fail','14 dossiers ouverts en 10 minutes, 20 fois plus que d\'habitude.');return finish(24,'Comportement inhabituel. Session suspendue, le responsable sécurité est alerté.');}
  set('ia','ok','Appareil habituel, horaire cohérent.');
  finish(96,'');
}
